name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.88.0"
          - os: macos-latest
            rust: "1.88.0"
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # The session helper shells out to ripgrep the same way it does on a real
      # machine, so the runner needs it before the helper can be tested at all.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          else
            brew install ripgrep
          fi
      - run: bash tests/register-existing-sessions.sh
      - run: cargo build --locked --release
